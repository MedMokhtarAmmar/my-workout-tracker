<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Tracker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
<link rel="stylesheet" href="style.css" />
<script src="/vendor/chart.js/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1><img class="brand-icon" src="/favicon.svg" alt="" /> Workout Tracker</h1>
    <nav>
      <button class="tab-btn active" data-tab="today">Today</button>
      <button class="tab-btn" data-tab="plans">Plans</button>
      <button class="tab-btn" data-tab="history">History</button>
      <button class="tab-btn" data-tab="calendar">Calendar</button>
      <button class="tab-btn" data-tab="progress">Progress</button>
      <button class="tab-btn" data-tab="stats">Body Stats</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main>
    <!-- TODAY -->
    <section id="tab-today" class="tab-panel active">
      <div class="card" id="week-progress-card">
        <h2>This week</h2>
        <div class="week-bar">
          <div class="week-bar-fill" id="week-bar-fill" style="width: 0%"></div>
        </div>
        <div class="week-bar-label" id="week-bar-label">0 of 0 workouts this week</div>
        <div class="week-chips" id="week-chips"></div>
        <div class="week-stat" id="week-volume">0 kg lifted this week</div>
      </div>

      <div id="today-setup" class="card">
        <h2>Start a workout</h2>
        <label>Date
          <input type="date" id="session-date" />
        </label>
        <label>Workout
          <select id="template-select"></select>
        </label>
        <button id="start-session-btn" class="primary">Start</button>
      </div>

      <div id="active-session" class="card hidden">
        <div class="session-head">
          <h2 id="active-session-title"></h2>
          <span id="active-session-date"></span>
        </div>
        <div id="exercise-list"></div>

        <div class="card subtle add-exercise-row">
          <label>Add an exercise to today's plan
            <select id="add-exercise-select"></select>
          </label>
          <button id="add-exercise-btn" class="secondary">+ Add exercise</button>
        </div>

        <div class="card subtle">
          <label>Cardio after lifting (minutes)
            <input type="number" id="cardio-minutes" min="0" value="0" />
          </label>
        </div>

        <button id="finish-session-btn" class="primary">Finish workout</button>
      </div>
    </section>

    <!-- PLANS -->
    <section id="tab-plans" class="tab-panel">
      <div id="plans-list"></div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tab-panel">
      <div class="card">
        <h2>Past sessions</h2>
        <div id="history-list"></div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section id="tab-calendar" class="tab-panel">
      <div class="card">
        <div class="calendar-nav">
          <button type="button" id="calendar-prev-btn" class="secondary">‹</button>
          <h2 id="calendar-month-label"></h2>
          <button type="button" id="calendar-next-btn" class="secondary">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
        <div class="calendar-legend">
          <span><span class="calendar-swatch done"></span> Worked out</span>
          <span><span class="calendar-swatch planned"></span> Planned</span>
          <span><span class="calendar-swatch missed"></span> Missed</span>
          <span><span class="calendar-swatch rest"></span> Rest</span>
        </div>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="tab-progress" class="tab-panel">
      <div class="card">
        <h2>Progress by exercise</h2>
        <label>Exercise
          <select id="exercise-select"></select>
        </label>
        <canvas id="progress-chart" height="120"></canvas>
        <div id="progress-table"></div>
      </div>
    </section>

    <!-- BODY STATS -->
    <section id="tab-stats" class="tab-panel">
      <nav class="segmented subtab-nav">
        <button type="button" class="segmented-btn active" data-subtab="log">Log</button>
        <button type="button" class="segmented-btn" data-subtab="weight">Weight</button>
        <button type="button" class="segmented-btn" data-subtab="history">History</button>
        <button type="button" class="segmented-btn" data-subtab="nutrition">Nutrition</button>
      </nav>

      <div id="subtab-log" class="subtab-panel active">
        <div class="card">
          <h2>Log body stats</h2>
          <label>Date
            <input type="date" id="stats-date" />
          </label>
          <label>Weight (kg)
            <input type="number" step="0.1" id="stats-weight" />
          </label>
          <label>Waist (cm)
            <input type="number" step="0.1" id="stats-waist" />
          </label>
          <button id="save-stats-btn" class="primary">Save</button>
        </div>
      </div>

      <div id="subtab-weight" class="subtab-panel">
        <div class="card">
          <h2>Weight over time</h2>
          <canvas id="weight-chart" height="120"></canvas>
        </div>
      </div>

      <div id="subtab-history" class="subtab-panel">
        <div class="card">
          <h2>History</h2>
          <div id="stats-table"></div>
        </div>
      </div>

      <div id="subtab-nutrition" class="subtab-panel">
        <div class="card">
          <h2>Nutrition calculator</h2>
          <label>Age (years)
            <input type="number" id="nutri-age" min="0" />
          </label>
          <label>Sex
            <select id="nutri-sex">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </label>
          <label>Weight (kg)
            <input type="number" step="0.1" id="nutri-weight" />
          </label>
          <label>Height (cm)
            <input type="number" step="0.1" id="nutri-height" />
          </label>
          <label>Activity level
            <select id="nutri-activity">
              <option value="1.2">Sedentary</option>
              <option value="1.375">Light exercise</option>
              <option value="1.55" selected>Moderate exercise</option>
              <option value="1.725">Heavy exercise</option>
              <option value="1.9">Athlete</option>
            </select>
          </label>
          <label>Goal
            <select id="nutri-goal">
              <option value="lose">Lose fat</option>
              <option value="maintain" selected>Maintain</option>
              <option value="gain">Gain muscle</option>
            </select>
          </label>
          <label>Calorie adjustment (optional, kcal — overrides the goal's default)
            <input type="number" id="nutri-adjustment" placeholder="e.g. -500" />
          </label>
          <label>Body fat % (optional, for lean/fat mass)
            <input type="number" step="0.1" id="nutri-bodyfat" />
          </label>
          <button id="nutri-calculate-btn" class="primary">Calculate</button>

          <div id="nutri-results" class="hidden"></div>
        </div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab-panel">
      <div class="card">
        <h2>Appearance</h2>
        <label>Theme</label>
        <div class="segmented" id="theme-toggle">
          <button type="button" class="segmented-btn" data-theme-choice="dark">Dark</button>
          <button type="button" class="segmented-btn" data-theme-choice="light">Light</button>
        </div>
      </div>
      <div class="card">
        <h2>Google Calendar</h2>
        <div class="settings-row">
          <span>Signed in as</span>
          <span id="settings-email" class="meta"></span>
        </div>
        <label>Reminder time for workout events
          <input type="time" id="reminder-time" />
        </label>
        <button id="save-settings-btn" class="primary">Save</button>
      </div>
      <div class="card">
        <button id="logout-btn" class="secondary">Sign out</button>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <button type="button" id="modal-close-btn" class="modal-close">✕</button>
      <div class="session-head">
        <h2 id="modal-title"></h2>
        <span id="modal-date"></span>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
